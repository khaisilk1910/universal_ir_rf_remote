rename_device:
  name: Rename virtual appliance
  description: Keep learned codes intact when renaming an appliance.
  fields:
    remote_entity:
      name: Managed remote
      selector: {entity: {domain: remote}}
    device:
      name: Current appliance name or ID
      required: true
      selector: {text: {}}
    name:
      name: New name
      required: true
      selector: {text: {}}
delete_device:
  name: Delete virtual appliance
  description: Delete the local appliance and buttons. Original provider codes are preserved.
  fields:
    remote_entity:
      name: Managed remote
      selector: {entity: {domain: remote}}
    device:
      name: Appliance name or ID
      required: true
      selector: {text: {}}
rename_command:
  name: Rename saved command
  description: Rename a command button while preserving its original provider code and unique ID.
  fields:
    remote_entity:
      name: Managed remote
      selector: {entity: {domain: remote}}
    device:
      name: Appliance
      required: true
      selector: {text: {}}
    command:
      name: Old command label
      required: true
      selector: {text: {}}
    name:
      name: New command label
      required: true
      selector: {text: {}}
import_code:
  name: Import Broadlink Base64 code
  description: Save an existing IR/RF packet for a named appliance without re-learning it.
  fields:
    remote_entity:
      name: Managed remote
      selector: {entity: {domain: remote}}
    device:
      name: Appliance name
      required: true
      selector: {text: {}}
    command:
      name: Command label
      required: true
      selector: {text: {}}
    command_type:
      name: Signal type
      selector:
        select:
          options: [ir, rf]
    code:
      name: Base64 (optionally prefixed with b64:)
      required: true
      selector:
        text:
          multiline: true
import_codes:
  name: Import multiple Base64 codes
  description: Atomically import a map of command labels to Broadlink Base64 signals for one virtual appliance.
  fields:
    remote_entity:
      name: Managed remote
      selector: {entity: {domain: remote}}
    device:
      name: Appliance name
      required: true
      selector: {text: {}}
    command_type:
      name: Signal type
      selector:
        select:
          options: [ir, rf]
    codes:
      name: Codes by command label
      required: true
      selector: {object: {}}
