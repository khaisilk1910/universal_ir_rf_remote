name: Publish GitHub release

# Preferred: Actions > Publish GitHub release > Run workflow > version: 4.2.0
# Versions MUST be updated before creating a tag so HACS downloads the right manifest.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New stable version (e.g. 4.2.0). No manual manifest edit needed."
        required: true
        type: string
  # Existing manual tag publishing remains supported, but fails if the manifest
  # at the tag does not already contain the correct version.
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: universal-ir-rf-remote-release
  cancel-in-progress: false

jobs:
  release:
    name: Sync version, verify, tag and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Determine release tag
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            tag="$(python tools/set_version.py --version "$REQUESTED_VERSION" --print-tag)"
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Ensure release does not already exist
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --quiet --verify "refs/tags/$RELEASE_TAG"; then
            echo "::error::The tag $RELEASE_TAG already exists. Choose a new version."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::The release $RELEASE_TAG already exists."
            exit 1
          fi

      - name: Update manifest.json before tagging
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python tools/set_version.py --version "$RELEASE_TAG"

      - name: Validate repository and version
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python tools/verify_repository.py --strict --tag "$RELEASE_TAG"
          python -m compileall -q custom_components tools tests
          python -m pytest -q

      - name: Commit version to main and create immutable release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/universal_ir_rf_remote/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $RELEASE_TAG"
          fi
          # Fast-forward only. Never move an already published tag.
          git push origin HEAD:main
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish source release for HACS
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG is already published."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --verify-tag
